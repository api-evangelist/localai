note: >-
  LocalAI ships a real, first-party proto3 contract alongside its REST surface, and it is the more
  interesting of the two. `backend.Backend` is the interface every LocalAI inference backend implements —
  llama.cpp, vllm.cpp, audio.cpp, whisper, stable-diffusion and the rest all speak it — which makes this
  the contract a third party writes against to add a new engine to LocalAI, rather than the one a client
  writes against to call it. It is saved verbatim; nothing here was authored by this pipeline.
  It also covers capability the REST surface does not expose: fine-tuning (StartFineTune,
  FineTuneProgress, StopFineTune, ListCheckpoints, ExportModel), quantization (StartQuantization,
  QuantizationProgress, StopQuantization), distributed forwarding (Forward), and bidirectional live audio
  (AudioTranscriptionLive, AudioTransformStream, AudioToAudioStream).
