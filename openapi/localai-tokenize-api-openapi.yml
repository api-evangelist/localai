openapi: 3.2.0
info:
  description: The LocalAI Rest API.
  title: LocalAI Tokenize API
  contact:
    name: LocalAI
    url: https://localai.io
  license:
    name: MIT
    url: https://raw.githubusercontent.com/mudler/LocalAI/master/LICENSE
  version: 2.0.0
servers:
- url: /
tags:
- name: Tokenize
paths:
  /tokenMetrics:
    get:
      tags:
      - Tokenize
      summary: Get TokenMetrics for Active Slot
      responses:
        '200':
          description: generated audio/wav file
          content:
            audio/x-wav:
              schema:
                type: string
      operationId: getTokenMetrics
      x-operation-id-source: derived
  /v1/detokenize:
    post:
      tags:
      - Tokenize
      summary: Detokenize the input
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schema.DetokenizeResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/schema.DetokenizeRequest'
        description: Request
        required: true
      operationId: postV1Detokenize
      x-operation-id-source: derived
  /v1/tokenMetrics:
    get:
      tags:
      - Tokenize
      summary: Get TokenMetrics for Active Slot
      responses:
        '200':
          description: generated audio/wav file
          content:
            audio/x-wav:
              schema:
                type: string
      operationId: getV1TokenMetrics
      x-operation-id-source: derived
  /v1/tokenize:
    post:
      tags:
      - Tokenize
      summary: Tokenize the input
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schema.TokenizeResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/schema.TokenizeRequest'
        description: Request
        required: true
      operationId: postV1Tokenize
      x-operation-id-source: derived
components:
  schemas:
    schema.DetokenizeRequest:
      type: object
      properties:
        model:
          type: string
        tokens:
          description: token IDs to convert back to text
          type: array
          items:
            type: integer
    schema.TokenizeResponse:
      type: object
      properties:
        tokens:
          description: token IDs
          type: array
          items:
            type: integer
    schema.TokenizeRequest:
      type: object
      properties:
        content:
          description: text to tokenize
          type: string
        model:
          type: string
    schema.DetokenizeResponse:
      type: object
      properties:
        content:
          description: detokenized text
          type: string
  securitySchemes:
    BearerAuth:
      type: apiKey
      name: Authorization
      in: header
