aid: localai
name: LocalAI
description: >-
  LocalAI is the open-source, self-hosted AI inference engine that acts as a drop-in replacement for the
  OpenAI and Anthropic REST APIs. A single Go binary (or container) exposes 123 HTTP operations across
  chat completions, completions, embeddings, image and video generation, 3D generation, text-to-speech,
  speech-to-text, audio classification and diarization, object detection, depth estimation, reranking,
  moderation, tokenization, face and voice recognition, and the OpenAI Realtime API over WebSocket and
  WebRTC — all running locally on CPU or GPU with no external API calls and no data leaving the host.
  Beyond OpenAI parity, LocalAI ships its own management surface: a model and backend gallery, P2P and
  federated distributed inference, an agent/job runtime with a Skills system and Agent Hub, request
  middleware for NER-based PII redaction and policy-based intelligent model routing, tracing, per-user
  usage accounting, and a first-party stdio MCP server (`local-ai mcp-server`) that exposes the admin
  surface as agent tools. Authentication spans legacy shared API keys through a full user system with
  roles, sessions, GitHub OAuth and OIDC single sign-on. Distributed under the MIT licence by Ettore Di
  Giacinto (mudler) and community contributors.
