source: >-
  Registry metadata endpoints (hub.docker.com, proxy.golang.org, go-skynet.github.io/helm-charts,
  api.github.com releases) plus https://localai.io/installation/
note: >-
  LocalAI is distributed as a server, not as a client SDK. There is no first-party client library in any
  language registry: because the API is OpenAI- and Anthropic-compatible, the documented integration path
  is the vendors' own SDKs pointed at a LocalAI base_url. The PyPI package `localai` (0.0.26, 2023-06-10)
  and the npm package `localai` (0.0.1, 2024-05-29) are unrelated third-party publications — the PyPI one
  is "Private AutoGPT Robot" by Viet-Anh Nguyen — and are recorded here explicitly so a later pass does
  not mistake them for first-party SDKs.
