name: LocalAI Assistant MCP server
status: published
deployment:
  mode: local-stdio
  endpoint: null
  install: 'local-ai mcp-server --target http://remote.localai:8080 --api-key <admin-key>'
  package: https://github.com/mudler/LocalAI
  auth: api-key
  verified: searched
deployment_note: >-
  There is no vendor-hosted remote MCP endpoint. The provider ships the server two ways, both requiring a
  LocalAI instance the operator runs. (1) In-process: when an admin flips the Manage toggle on a chat
  session, the conversation is wired to an in-process MCP server — no loopback socket, no synthetic API
  key, no extra TCP port — so it is reachable only from inside that LocalAI process, never by an external
  agent. (2) Standalone stdio: `local-ai mcp-server --target <url> --api-key <admin-key>` runs the same
  tool catalog as a stdio server pointed at any LocalAI HTTP API, for hooking into Claude Desktop, Cursor
  or another MCP host. `--read-only` skips registration of every mutating tool. The tool catalog is
  identical in both variants. The mode is therefore local-stdio, not remote: a human must install and run
  it before any agent can reach it.
tool_source: >-
  Verbatim from the published tool catalog in the LocalAI Assistant documentation, plus the middleware
  documentation's two MCP tool tables. Input schemas were not read — that requires authenticated
  introspection against a running instance, which this pass had no access to.
