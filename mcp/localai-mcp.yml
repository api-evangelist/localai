tool_count: 25
safety:
  admin_only: true
  confirmation: >-
    Mutating tools are guarded by a system-prompt rule requiring the model to confirm the action with the
    user before calling them. There is no separate code-side preview/apply step.
  read_only_flag: --read-only
  disable: LOCALAI_DISABLE_ASSISTANT=true (chat requests with metadata.localai_assistant=true then return 503)
mcp_client_capability:
  note: >-
    Distinct from the server above, LocalAI is also an MCP HOST — it connects models and agents outward to
    remote HTTP and local stdio MCP servers and executes their tools server-side inside the completion
    loop. This is configuration, not an agent surface LocalAI exposes, so it does not affect deployment.mode.
  endpoints:
  - POST /v1/mcp/chat/completions
  - POST /mcp/v1/chat/completions
  - POST /mcp/chat/completions
  selection: metadata.mcp_servers (comma-separated server names, stripped before reaching the backend)
  scopes:
  - model-scoped via the `mcp:` block in a model YAML (remote + stdio)
  - agent-scoped via an agent's mcp_servers / mcp_stdio_servers fields
  features:
  - MCP Prompts — discover and expand reusable prompt templates from MCP servers
  - MCP Resources — browse and inject resource content from MCP servers into conversations
  - Bearer token authentication to remote MCP servers
  - agent.max_iterations caps the tool execution loop (default 10)
  docs: https://localai.io/features/mcp
