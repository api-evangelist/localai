note: >-
  LocalAI publishes no rate limits, and structurally cannot: it is self-hosted software with no vendor-
  operated service and no commercial quota to enforce. Throughput is bounded by the operator's own
  hardware and by concurrency settings, not by a policy. Searched the CLI/environment reference, the
  authentication reference, the middleware reference and all 123 published operations — no rate-limit
  policy, no 429 response, and no rate-limit response header is documented or declared anywhere.
  Recording an honest zero rather than omitting the artifact.
limits: []
