versioning:
  scheme: semver
  current_version: v4.9.0
  current_version_released: '2026-08-20'
  api_versioning: >-
    Path-prefix versioning inherited from the APIs LocalAI imitates — /v1/* for the OpenAI- and
    Anthropic-compatible surface. LocalAI's own management endpoints are unversioned (/api/*, /models/*,
    /backends/*, /system). The product version and the API version are not the same thing: the Swagger
    document declares info.version 2.0.0 while the software is at 4.9.0, so the contract's own version
    field has not tracked a release in two major versions.
  release_cadence: >-
    Frequent. Ten releases probed span v4.5.6 (2026-06-30) to v4.9.0 (2026-08-20) — roughly weekly to
    fortnightly, with patch releases landing within a day of a minor (v4.8.0 2026-08-05, v4.8.1
    2026-08-06, v4.8.2 2026-08-07).
