note: >-
  No /.well-known/ document is served on any host this company controls, so no WellKnown or SecurityTxt
  pointer is emitted in apis.yml — this file records a measured absence, not a presence. The absence is
  structural rather than negligent: LocalAI is self-hosted software, and its discovery documents are
  served by the customer's own instance, not by the project's marketing/docs site. A running LocalAI
  instance does serve GET /.well-known/localai.json (instance version, endpoint URLs flat and categorized,
  and runtime capability flags for config_metadata, config_patch, vram_estimate, mcp, agents and p2p) plus
  GET /api/instructions and GET /api/instructions/{name}, all three anonymous even when authentication is
  configured. Those are documented at https://localai.io/docs/features/api-discovery/ and appear in the
  published Swagger document; they cannot be probed here because there is no vendor-operated instance.
